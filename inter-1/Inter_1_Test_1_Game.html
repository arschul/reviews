<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test 1 Arcade · Intermediate 1 — Phil Young's English School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17151f;
  --paper:#f0eef6;
  --tint:#f0eef6;
  --hue:#2d7df6;
  --good:#12b76a;
  --bad:#ff4d3d;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --shadow:5px 5px 0 var(--ink);
  --shadow-sm:3px 3px 0 var(--ink);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--body);color:var(--ink);font-size:16px;line-height:1.45;
  background:var(--tint);transition:background .35s ease;
  min-height:100vh;
}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 60px}
h1,h2,h3,.disp{font-family:var(--display);font-weight:800;letter-spacing:-.02em;line-height:1}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.mark{
  font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.02em;
  background:var(--ink);color:#fff;padding:5px 10px;border-radius:999px;text-transform:uppercase;
}
.sub{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b6779}
.icon-btn{
  margin-left:auto;background:#fff;border:2.5px solid var(--ink);border-radius:10px;
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:16px;
  box-shadow:var(--shadow-sm);
}
.icon-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

/* ---------- hero ---------- */
.hero{
  background:var(--hue);border:3px solid var(--ink);border-radius:18px;
  box-shadow:var(--shadow);padding:22px 18px;margin-bottom:18px;color:#fff;
  position:relative;overflow:hidden;
}
.hero h1{font-size:clamp(34px,11vw,50px);margin:0;text-transform:uppercase;color:#fff}
.hero .kicker{
  font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  opacity:.85;margin-bottom:8px;
}
.hero p{margin:10px 0 0;font-size:14.5px;max-width:34ch;opacity:.95}
.hero .blob{
  position:absolute;right:-30px;top:-30px;font-size:120px;opacity:.22;transform:rotate(14deg);
  pointer-events:none;user-select:none;
}

/* ---------- generic blocks ---------- */
.block{
  background:#fff;border:3px solid var(--ink);border-radius:16px;
  box-shadow:var(--shadow);padding:16px;margin-bottom:16px;
}
.label{
  font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:#6b6779;margin-bottom:9px;
}
.big{background:var(--ink);color:#fff;border:3px solid var(--ink);border-radius:14px;
  padding:15px 18px;width:100%;font-family:var(--display);font-weight:800;font-size:18px;
  text-transform:uppercase;letter-spacing:.01em;box-shadow:var(--shadow);}
.big:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.big.hue{background:var(--hue)}
.lite{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:11px 14px;
  width:100%;font-weight:600;font-size:14.5px;box-shadow:var(--shadow-sm);margin-top:9px}
.lite:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

/* ---------- mode switch ---------- */
.modes{display:flex;gap:9px}
.mode{
  flex:1;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:11px 8px;
  text-align:center;box-shadow:var(--shadow-sm);
}
.mode b{display:block;font-family:var(--display);font-weight:800;font-size:15px}
.mode span{font-size:11.5px;color:#6b6779}
.mode.on{background:var(--hue);color:#fff}
.mode.on span{color:rgba(255,255,255,.85)}

/* ---------- round grid ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{
  border:3px solid var(--ink);border-radius:14px;padding:10px 8px 9px;text-align:left;
  box-shadow:var(--shadow-sm);color:#fff;position:relative;min-height:92px;
  display:flex;flex-direction:column;justify-content:space-between;
}
.tile:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.tile .em{font-size:22px;line-height:1}
.tile .ltr{
  position:absolute;top:7px;right:9px;font-family:var(--display);font-weight:800;
  font-size:19px;opacity:.55;
}
.tile .nm{font-family:var(--display);font-weight:800;font-size:13.5px;line-height:1.1;margin-top:6px}
.tile .sc{font-size:11px;font-weight:600;opacity:.85;margin-top:3px}
.tile.cleared{box-shadow:var(--shadow-sm),inset 0 0 0 3px rgba(255,255,255,.55)}

/* ---------- stickers ---------- */
.stickers{display:flex;flex-wrap:wrap;gap:7px}
.st{
  width:38px;height:38px;border:2.5px solid var(--ink);border-radius:11px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:19px;
}
.st.locked{background:#e4e1ec;filter:grayscale(1);opacity:.55;font-size:15px}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.chip{
  background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:5px 11px;
  font-family:var(--display);font-weight:800;font-size:14px;box-shadow:var(--shadow-sm);
  display:flex;align-items:center;gap:5px;
}
.chip.round{background:var(--hue);color:#fff}
.hearts{margin-left:auto;font-size:15px;letter-spacing:2px}
.heart.gone{opacity:.25;filter:grayscale(1)}
.timerbar{height:9px;background:#fff;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden;margin-bottom:14px}
.timerbar i{display:block;height:100%;background:var(--hue);width:100%}
.timerbar.low i{background:var(--bad)}
.segs{display:flex;gap:4px;margin-bottom:14px}
.seg{height:7px;flex:1;border:2px solid var(--ink);border-radius:4px;background:#fff}
.seg.hit{background:var(--good)}
.seg.miss{background:var(--bad)}
.seg.now{background:var(--hue)}

/* ---------- question ---------- */
.qcard{
  background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:var(--shadow);
  padding:16px;margin-bottom:14px;
}
.tip{
  background:var(--hue);color:#fff;border:3px solid var(--ink);border-radius:12px;
  padding:9px 12px;font-size:13px;font-weight:500;margin-bottom:13px;box-shadow:var(--shadow-sm);
}
.q{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.3;margin:0}
.q .gap{display:inline-block;min-width:52px;border-bottom:3px solid var(--hue)}
.opt{
  display:block;width:100%;text-align:left;background:#fff;border:2.5px solid var(--ink);
  border-radius:13px;padding:13px 14px;margin-bottom:9px;font-weight:600;font-size:16px;
  box-shadow:var(--shadow-sm);min-height:50px;
}
.opt:active:enabled{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt .k{
  display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border:2px solid var(--ink);border-radius:6px;font-size:11px;margin-right:10px;
  font-family:var(--display);font-weight:800;vertical-align:-4px;
}
.opt.right{background:var(--good);color:#fff}
.opt.wrong{background:var(--bad);color:#fff}
.opt.fade:disabled{opacity:.4}
.opt:disabled{cursor:default}
.opts.pairs .opt,.opts.tf .opt{text-align:center;font-size:17px}
.opts.tf{display:flex;gap:9px}
.opts.tf .opt{text-transform:uppercase;font-family:var(--display);font-weight:800}
.opts.chips{display:flex;flex-wrap:wrap;gap:9px}
.opts.chips .opt{width:auto;flex:1 1 calc(50% - 5px);text-align:center;font-size:17px;margin:0}
.pw{font-style:italic}

/* ---------- feedback ---------- */
.fb{
  border:3px solid var(--ink);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow);
  background:#fff;
}
.fb.y{background:#e7f8ef}
.fb.n{background:#ffeeec}
.fb h3{font-size:18px;margin:0 0 5px;display:flex;align-items:center;gap:7px}
.fb p{margin:0 0 12px;font-size:14px}
.pop{
  font-family:var(--display);font-weight:800;font-size:13px;background:var(--ink);color:#fff;
  border-radius:999px;padding:2px 9px;margin-left:auto;
}
.passage{
  background:#fff;border:3px solid var(--ink);border-left-width:10px;border-radius:14px;
  padding:14px 15px;margin-bottom:14px;box-shadow:var(--shadow);
}
.passage h3{font-size:19px;text-align:center;margin:0 0 9px}
.passage p{font-size:15px;line-height:1.55;margin:0 0 8px}
.passage p:last-child{margin-bottom:0}

/* ---------- results ---------- */
.xp{font-family:var(--display);font-weight:800;font-size:64px;line-height:1}
.rank{font-family:var(--display);font-weight:800;font-size:26px;margin:2px 0 4px;text-transform:uppercase}
.row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:2px solid #e4e1ec;font-size:14px}
.row:last-child{border-bottom:none}
.rl{font-family:var(--display);font-weight:800;width:22px}
.bar{margin-left:auto;width:70px;height:9px;border:2px solid var(--ink);border-radius:5px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%}
footer{margin-top:26px;font-size:11.5px;color:#6b6779;text-align:center}
footer a{color:#6b6779}

/* ---------- motion ---------- */
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.shake{animation:shake .35s}
.popin{animation:pop .28s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="mark">Phil Young's</span>
    <span class="sub">Inter 1 · Units 1&amp;2</span>
    <button class="icon-btn" id="snd" title="Sound">🔇</button>
  </div>
  <main id="app"></main>
  <footer>Intermediate 1 · Test 1 · <a href="../index.html">Review Hub</a></footer>
</div>

<script>
"use strict";

/* ================================================================= content */
const HUES = ["#ff4d3d","#2d7df6","#12b76a","#8b5cf6","#ff8a00","#00b8c4","#ff5fa2"];

const STAGES = [
{ letter:"A", name:"Tag Team", sub:"Question tags", em:"🏷️", sticker:"🐕", type:"mc",
  tip:"Positive sentence → negative tag. Negative sentence → positive tag.",
  qs:[
    {q:"Your cousin trains police dogs, <span class='gap'></span> he?", o:["does","doesn't","isn't"], a:1,
     why:"<b>trains</b> is positive present simple, so the tag goes negative: <b>doesn't he?</b>"},
    {q:"Penguins can't fly, <span class='gap'></span> they?", o:["can","can't","do"], a:0,
     why:"Negative sentence with <b>can't</b> → positive tag <b>can they?</b>"},
    {q:"The vet isn't working today, <span class='gap'></span> she?", o:["is","isn't","does"], a:0,
     why:"Negative <b>isn't</b> → positive tag <b>is she?</b> The tag repeats the auxiliary."},
    {q:"They're afraid of snakes, <span class='gap'></span> they?", o:["are","aren't","don't"], a:1,
     why:"Positive <b>are</b> → negative tag <b>aren't they?</b>"},
    {q:"Lia and Bruno don't eat meat, <span class='gap'></span> they?", o:["do","don't","are"], a:0,
     why:"Negative <b>don't</b> → positive tag <b>do they?</b>"}
  ]},

{ letter:"B", name:"Into the Wild", sub:"Animals", em:"🦈", sticker:"🐢", type:"mc",
  tip:"Read the clue, name the animal.",
  qs:[
    {q:"Nobody swims at that beach in summer, because these hunters come close to the shore.", o:["sharks","whales","turtles"], a:0, why:"<b>Sharks</b> — the hunters that keep swimmers out of the water."},
    {q:"They are the largest animals in the ocean, and they breathe air.", o:["porcupines","whales","sharks"], a:1, why:"<b>Whales</b> are mammals, so they surface to breathe."},
    {q:"Don't try to pick these up — their spikes come off in your hands.", o:["turtles","tigers","porcupines"], a:2, why:"<b>Porcupines</b> defend themselves with spikes."},
    {q:"Volunteers guard the nests until the babies reach the water.", o:["turtles","whales","sharks"], a:0, why:"<b>Turtles</b> lay their eggs on the beach."},
    {q:"Our guide said these cats hunt alone and can weigh over 200 kilos.", o:["whales","tigers","porcupines"], a:1, why:"<b>Tigers</b> — big cats that hunt alone."}
  ]},

{ letter:"C", name:"Who Does That?", sub:"Jobs with animals", em:"🔬", sticker:"🐬", type:"mc",
  tip:"Five people, five job titles.",
  qs:[
    {q:"Dives with a team to count coral fish and record the water temperature.", o:["marine biologist","zoologist","breeder"], a:0, why:"A <b>marine biologist</b> studies life in the sea."},
    {q:"Walks through the airport with her animal, looking for illegal substances in the luggage.", o:["horse trainer","dog handler","breeder"], a:1, why:"A <b>dog handler</b> works with a trained dog."},
    {q:"Chooses which parents will have puppies and keeps records of every litter.", o:["breeder","zoologist","dog handler"], a:0, why:"A <b>breeder</b> decides which animals reproduce."},
    {q:"Works at a stable and teaches young animals to accept a rider.", o:["zoologist","marine biologist","horse trainer"], a:2, why:"A <b>horse trainer</b> prepares horses for riding."},
    {q:"Writes scientific reports about the behavior of monkeys in the wild.", o:["zoologist","breeder","dog handler"], a:0, why:"A <b>zoologist</b> studies animals scientifically."}
  ]},

{ letter:"D", name:"Read the Room", sub:"Personality", em:"🎭", sticker:"🦁", type:"pair",
  tip:"Which adjective matches the behaviour?",
  qs:[
    {q:"Nina refused all help and carried the four boxes herself; she's very …", o:["independent","generous"], a:0, why:"Doing things without help is <b>independent</b>."},
    {q:"He gave half of his lunch to the new student — that was really …", o:["selfish","generous"], a:1, why:"Giving things away is <b>generous</b>. <i>Selfish</i> is the opposite."},
    {q:"Pedro speaks to a thousand people without shaking; he's …", o:["curious","confident"], a:1, why:"No nerves in front of an audience = <b>confident</b>."},
    {q:"She hands everything in on time, so we know she's …", o:["reliable","creative"], a:0, why:"Someone you can depend on is <b>reliable</b>."},
    {q:"Diana ran into the smoke to get the cat out; that was …", o:["brave","calm"], a:0, why:"Acting in spite of danger is <b>brave</b>."}
  ]},

{ letter:"E", name:"Five Senses", sub:"Senses & behaviour", em:"👀", sticker:"🦉", type:"pair",
  tip:"Senses, behaviour, and two adjectives from Unit 2.",
  qs:[
    {q:"Rescue dogs find people under the snow using their sense of …", o:["smell","sight"], a:0, why:"Dogs work by <b>smell</b> — they can't see through snow."},
    {q:"Owls hunt at night because their … is excellent in the dark.", o:["behavior","sight"], a:1, why:"<b>Sight</b> is the sense of seeing."},
    {q:"Octopuses can open jars, which shows how … they are.", o:["cute","intelligent"], a:1, why:"Solving problems shows they are <b>intelligent</b>."},
    {q:"The puppies were so … that nobody wanted to leave the shelter.", o:["cute","reliable"], a:0, why:"<b>Cute</b> = small and lovely to look at."},
    {q:"The team recorded the wolves' … every night for six months.", o:["smell","behavior"], a:1, why:"What an animal does is its <b>behavior</b>."}
  ]},

{ letter:"F", name:"Word Lab", sub:"Noun forms", em:"🧪", sticker:"🐙", type:"mc",
  tip:"Same word, different ending. Pick the noun.",
  qs:[
    {q:"There is no <span class='gap'></span> of getting tickets now — the show sold out in ten minutes.", o:["possibility","possibly","availability"], a:0, why:"<i>possible</i> → <b>possibility</b>."},
    {q:"The news about the old elephant filled the whole team with <span class='gap'></span>.", o:["sadly","sadness","illness"], a:1, why:"<i>sad</i> → <b>sadness</b>."},
    {q:"The <span class='gap'></span> of lighter racing chairs has changed the sport completely.", o:["developing","argument","development"], a:2, why:"<i>develop</i> → <b>development</b>."},
    {q:"He missed the whole season because of a rare <span class='gap'></span>.", o:["illness","ill","sadness"], a:0, why:"<i>ill</i> → <b>illness</b>."},
    {q:"Check the website for the <span class='gap'></span> of rooms in July.", o:["available","possibility","availability"], a:2, why:"<i>available</i> → <b>availability</b>."}
  ]},

{ letter:"G", name:"One Word Only", sub:"Unit 2 vocabulary", em:"🎯", sticker:"🐝", type:"mc",
  tip:"Only one of the three fits.",
  qs:[
    {q:"It is almost <span class='gap'></span> to train a cat to walk on a lead.", o:["impossible","disabled","disease"], a:0, why:"<b>impossible</b> = cannot be done."},
    {q:"Athletes who are <span class='gap'></span> compete in the Paralympic Games every four years.", o:["disease","disabled","impossible"], a:1, why:"<b>disabled</b> describes a person with a physical or mental condition."},
    {q:"Scientists are testing a vaccine against a <span class='gap'></span> that kills young bees.", o:["disease","disabled","impossible"], a:0, why:"A <b>disease</b> is an illness that can spread."},
    {q:"You have to <span class='gap'></span> your seat before you pay for the ticket.", o:["recognize","develop","select"], a:2, why:"<b>select</b> = choose from a set of options."},
    {q:"I didn't <span class='gap'></span> my old teacher without her glasses.", o:["recognize","select","develop"], a:0, why:"<b>recognize</b> = know someone when you see them again."}
  ]},

{ letter:"H", name:"Can You?", sub:"Ability", em:"💪", sticker:"🐎", type:"mc",
  tip:"manage <b>to</b> + verb · succeed <b>in</b> + verb-ing · be able <b>to</b> + verb",
  qs:[
    {q:"When I was six I <span class='gap'></span> swim at all.", o:["can't","couldn't","don't able"], a:1, why:"Past ability, negative → <b>couldn't</b> + verb."},
    {q:"She <span class='gap'></span> in floating on her back after ten lessons.", o:["succeeded","managed","could"], a:0, why:"Only <b>succeed</b> takes <i>in + verb-ing</i>."},
    {q:"They <span class='gap'></span> to cross the lake in under an hour.", o:["succeeded","managed","can"], a:1, why:"<b>manage</b> is followed by <i>to</i> + verb."},
    {q:"Sorry — I won't <span class='gap'></span> to come to training tomorrow.", o:["can","be able","could"], a:1, why:"After <i>won't</i> you need <b>be able to</b> — you can't put two modals together."},
    {q:"<span class='gap'></span> you swim when you were five?", o:["Can","Could","Did"], a:1, why:"Past ability in a question → <b>Could you…?</b>"}
  ]},

{ letter:"I", name:"Freeze Frame", sub:"Stative or continuous", em:"🧠", sticker:"🐘", type:"pair",
  tip:"Some verbs describe states, not actions — they don't take -ing here.",
  qs:[
    {q:"Right now Bia … the dolphins from the boat.", o:["watches","is watching"], a:1, why:"Happening now → <b>is watching</b>."},
    {q:"Sam really … his new job at the aquarium.", o:["loves","is loving"], a:0, why:"<b>love</b> is a state verb, so it stays simple."},
    {q:"I … she's right about the sharks.", o:["am thinking","think"], a:1, why:"<i>think</i> = have an opinion → state verb → <b>think</b>."},
    {q:"My cousin … why the aquarium closed.", o:["doesn't understand","isn't understanding"], a:0, why:"<b>understand</b> is a state verb."},
    {q:"Be quiet — the puppy … .", o:["sleeps","is sleeping"], a:1, why:"Happening at this moment → <b>is sleeping</b>."}
  ]},

{ letter:"J", name:"Article Alley", sub:"a / an / the / —", em:"🔤", sticker:"🦜", type:"chip",
  tip:"The dash — means no article at all.",
  qs:[
    {q:"My uncle is <span class='gap'></span> zoologist.", o:["a","an","the","—"], a:0, why:"One of many jobs, consonant sound → <b>a</b> zoologist."},
    {q:"She gave me <span class='gap'></span> advice about the course.", o:["a","an","the","—"], a:3, why:"<i>advice</i> is uncountable here → <b>no article</b>."},
    {q:"I'm doing a dog-handling course. <span class='gap'></span> course takes eighteen months.", o:["A","An","The","—"], a:2, why:"Second mention of the same course → <b>The</b>."},
    {q:"Last night I watched <span class='gap'></span> excellent documentary about crows.", o:["a","an","the","—"], a:1, why:"<i>excellent</i> starts with a vowel sound → <b>an</b>."},
    {q:"<span class='gap'></span> dogs in that video all came from the same shelter.", o:["A","An","The","—"], a:2, why:"Specific dogs the listener knows about → <b>The</b>."}
  ]},

{ letter:"K", name:"Boss Level", sub:"Reading", em:"📖", sticker:"🐦‍⬛", type:"tf",
  tip:"Read the text, then decide. You can bring it back at any time.",
  passage:{
    title:"The Crows of Sendai",
    paras:[
      "In the Japanese city of Sendai, drivers began to notice something strange at one busy crossing. Crows were dropping walnuts onto the road, waiting for a car to break the shell, and then coming down to collect the pieces. Nuts that fell in the wrong place were simply left there.",
      "A few years later the birds changed the routine. They started to release the nuts only when the traffic lights turned red, and to walk out among the stopped cars with the pedestrians. Nobody trained them. Researchers who filmed the crossing believe that one or two clever birds discovered the trick and that the younger crows copied them.",
      "The behavior is not found everywhere in the city. It appears mainly around one university campus, and even there some crows never learn it. Scientists studying the same species have also shown that crows recognize individual human faces: a person who once frightened a bird may be shouted at by the whole group years afterwards.",
      "The team is careful about what all this proves. A crow that waits for a red light is not necessarily thinking about traffic rules. It may simply have learned that a particular colour is followed by safe, quiet seconds on the road — and that those seconds are worth waiting for."
    ]
  },
  qs:[
    {q:"The crows learned to use the traffic lights from people.", o:["True","False"], a:1, why:"False — nobody trained them; younger crows copied older ones."},
    {q:"Every crow in Sendai drops nuts onto the road.", o:["True","False"], a:1, why:"False — it happens mainly near one campus, and even there some crows never learn it."},
    {q:"The crows probably learn this behaviour by watching each other.", o:["True","False"], a:0, why:"True — the researchers believe younger birds copied the first clever ones."},
    {q:"A crow can remember a person it considers dangerous.", o:["True","False"], a:0, why:"True — crows recognize faces and may react to the same person years later."}
  ]}
];

const RANKS = [
  [90,"Zoologist","You could teach this unit."],
  [75,"Marine Biologist","Strong run. Check the short bars below."],
  [60,"Dog Handler","Solid. One more run gets you past 75%."],
  [40,"Breeder","Replay the rounds with the shortest bars."],
  [0,"Volunteer","Read the review sheet again, then come back."]
];

/* =================================================================== state */
const app = document.getElementById("app");
const R = STAGES.map(s => ({correct:0, total:s.qs.length, xp:0, done:false}));
let si=0, qi=0, combo=0, bestCombo=0, xp=0, lives=3, timed=false, sound=false;
let answered=false, tick=null, tLeft=0, tStart=0;
const LIMIT = 15;

const hue = i => HUES[i % HUES.length];
const setHue = (c, tintOn) => {
  document.documentElement.style.setProperty("--hue", c);
  document.body.style.setProperty("--tint", tintOn ? c + "1f" : "#f0eef6");
};

/* --------------------------------------------------------------- sound fx */
let AC = null;
function blip(freq, dur, type){
  if (!sound) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(.06, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + dur);
  }catch(e){}
}
document.getElementById("snd").onclick = e => {
  sound = !sound;
  e.currentTarget.textContent = sound ? "🔊" : "🔇";
  blip(660, .08);
};

/* ==================================================================== home */
function home(){
  document.onkeydown = null; stopTimer(); setHue("#2d7df6", false);
  const cleared = R.filter(r=>r.done).length;
  app.innerHTML = `
    <div class="hero">
      <span class="blob">🦈</span>
      <div class="kicker">Test 1 Review · Units 1 &amp; 2</div>
      <h1>Animal<br>Instinct</h1>
      <p>Eleven rounds. Chain correct answers to build a combo — every third one raises your multiplier.</p>
    </div>

    <div class="block">
      <div class="label">Choose how you play</div>
      <div class="modes">
        <button class="mode ${timed?'':'on'}" data-m="0"><b>Chill</b><span>No clock, no lives</span></button>
        <button class="mode ${timed?'on':''}" data-m="1"><b>Timed</b><span>15s · 3 lives</span></button>
      </div>
      <button class="big hue" id="go" style="margin-top:13px">
        ${cleared===STAGES.length ? "See final results" : (cleared ? "Continue" : "Start round A")}
      </button>
    </div>

    <div class="block">
      <div class="label">Rounds · ${cleared} of ${STAGES.length} cleared</div>
      <div class="grid">
        ${STAGES.map((s,i)=>`
          <button class="tile ${R[i].done?'cleared':''}" data-i="${i}" style="background:${hue(i)}">
            <span class="ltr">${s.letter}</span>
            <span class="em">${s.em}</span>
            <span>
              <span class="nm">${s.name}</span>
              <span class="sc">${R[i].done ? R[i].correct+"/"+R[i].total : s.qs.length+" questions"}</span>
            </span>
          </button>`).join("")}
      </div>
    </div>

    <div class="block">
      <div class="label">Sticker book · ${R.filter((r,i)=>r.done && r.correct>=r.total-1).length} of ${STAGES.length}</div>
      <div class="stickers">
        ${STAGES.map((s,i)=>{
          const got = R[i].done && R[i].correct >= R[i].total - 1;
          return `<span class="st ${got?'':'locked'}" title="${s.name}">${got?s.sticker:'🔒'}</span>`;
        }).join("")}
      </div>
      <p style="font-size:12.5px;color:#6b6779;margin:10px 0 0">Clear a round with no more than one mistake to unlock its sticker.</p>
      ${cleared ? `<button class="lite" id="reset">Wipe everything and start over</button>` : ""}
    </div>
  `;
  app.querySelectorAll(".mode").forEach(b => b.onclick = () => { timed = b.dataset.m === "1"; blip(520,.06); home(); });
  app.querySelectorAll(".tile").forEach(b => b.onclick = () => start(+b.dataset.i));
  document.getElementById("go").onclick = () => {
    if (R.every(r=>r.done)) return finish();
    const n = R.findIndex(r=>!r.done); start(n < 0 ? 0 : n);
  };
  const rs = document.getElementById("reset");
  if (rs) rs.onclick = () => { R.forEach(r=>{r.correct=0;r.xp=0;r.done=false;}); xp=0; bestCombo=0; home(); };
}

/* ==================================================================== play */
function start(i){ si=i; qi=0; combo=0; lives=3; R[i].correct=0; R[i].xp=0; render(); }

function render(){
  const s = STAGES[si], q = s.qs[qi];
  answered = false; setHue(hue(si), true);
  const keys = s.type==="tf" ? ["T","F"] : ["1","2","3","4"];
  const cls = s.type==="pair" ? "pairs" : s.type==="chip" ? "chips" : s.type==="tf" ? "tf" : "";

  app.innerHTML = `
    <div class="hud">
      <span class="chip round">${s.letter}<span style="font-size:11px;opacity:.9">${qi+1}/${s.qs.length}</span></span>
      <span class="chip" id="combochip">⚡ ×${mult()}</span>
      <span class="chip">${xp}</span>
      ${timed ? `<span class="hearts">${[0,1,2].map(n=>`<span class="heart ${n<lives?'':'gone'}">❤️</span>`).join("")}</span>` : ""}
    </div>
    ${timed ? `<div class="timerbar" id="tb"><i></i></div>` : ""}
    <div class="segs">${s.qs.map((_,i)=>`<span class="seg ${i<qi?'hit':i===qi?'now':''}"></span>`).join("")}</div>
    ${qi===0 && s.tip ? `<div class="tip">${s.tip}</div>` : ""}
    ${s.passage && qi===0 ? passage(s.passage) : ""}
    ${s.passage && qi>0 ? `<button class="lite" id="re" style="margin:0 0 12px">📖 Show the text again</button><div id="reslot"></div>` : ""}
    <div class="qcard"><p class="q">${q.q}</p></div>
    <div class="opts ${cls}" id="opts">
      ${q.o.map((o,i)=>`<button class="opt" data-o="${i}">${s.type==="chip"?"":`<span class="k">${keys[i]}</span>`}<span class="${s.type==="pair"?"pw":""}">${o}</span></button>`).join("")}
    </div>
    <div id="fb"></div>
  `;
  const re = document.getElementById("re");
  if (re) re.onclick = () => { document.getElementById("reslot").innerHTML = passage(s.passage); re.remove(); };
  app.querySelectorAll("[data-o]").forEach(b => b.onclick = () => answer(+b.dataset.o));

  document.onkeydown = e => {
    if (answered){ if (e.key==="Enter"||e.key===" "){ e.preventDefault(); next(); } return; }
    let idx = -1;
    if (s.type==="tf"){ const k=e.key.toLowerCase(); if(k==="t")idx=0; if(k==="f")idx=1; }
    if (idx<0 && /^[1-4]$/.test(e.key)) idx = +e.key-1;
    if (idx>=0 && idx<q.o.length) answer(idx);
  };

  tStart = Date.now();
  if (timed) startTimer();
}

function passage(p){ return `<div class="passage"><h3>${p.title}</h3>${p.paras.map(x=>`<p>${x}</p>`).join("")}</div>`; }
function mult(){ return Math.min(5, 1 + Math.floor(combo/3)); }

function startTimer(){
  tLeft = LIMIT;
  const bar = document.querySelector("#tb i"), box = document.getElementById("tb");
  tick = setInterval(()=>{
    tLeft -= .1;
    if (bar) bar.style.width = Math.max(0, tLeft/LIMIT*100) + "%";
    if (box) box.classList.toggle("low", tLeft <= 5);
    if (tLeft <= 0) answer(-1);
  }, 100);
}
function stopTimer(){ if (tick){ clearInterval(tick); tick = null; } }

function answer(pick){
  if (answered) return;
  answered = true; stopTimer();
  const s = STAGES[si], q = s.qs[qi], right = pick === q.a, out = pick === -1;
  const secs = (Date.now()-tStart)/1000;
  let gain = 0;

  if (right){
    const speed = timed ? Math.max(0, Math.round((LIMIT-secs)*4)) : 0;
    gain = (100 + speed) * mult();
    combo++; bestCombo = Math.max(bestCombo, combo); R[si].correct++;
    blip(mult()>2 ? 880 : 700, .1);
  } else {
    combo = 0;
    if (timed) lives--;
    blip(150, .18, "sawtooth");
  }
  xp += gain; R[si].xp += gain;

  app.querySelectorAll("[data-o]").forEach((b,i)=>{
    b.disabled = true;
    if (i === q.a) b.classList.add("right");
    else if (i === pick) b.classList.add("wrong");
    else b.classList.add("fade");
  });
  document.querySelectorAll(".seg")[qi].className = "seg " + (right ? "hit" : "miss");
  const cc = document.getElementById("combochip");
  if (cc){ cc.textContent = "⚡ ×" + mult(); cc.classList.add("popin"); }
  if (!right){ const o = document.getElementById("opts"); if (o) o.classList.add("shake"); }

  const dead = timed && lives <= 0;
  const last = qi === s.qs.length - 1;
  document.getElementById("fb").innerHTML = `
    <div class="fb ${right?'y':'n'}">
      <h3>${right ? (mult()>2 ? "On fire." : "Correct.") : out ? "Out of time." : "Nope."}
        ${gain ? `<span class="pop">+${gain}</span>` : ""}</h3>
      <p>${q.why}</p>
      <button class="big" id="next">${dead ? "Round over" : last ? "Finish round "+s.letter : "Next"}</button>
    </div>`;
  const nb = document.getElementById("next");
  nb.onclick = () => dead ? dead_screen() : next();
  nb.focus({preventScroll:true});
}

function next(){
  if (qi < STAGES[si].qs.length - 1){ qi++; render(); return; }
  R[si].done = true; roundEnd();
}

function dead_screen(){
  document.onkeydown = null;
  const s = STAGES[si];
  app.innerHTML = `
    <div class="hero"><span class="blob">💀</span>
      <div class="kicker">Round ${s.letter} · ${s.name}</div>
      <h1>Out of<br>lives</h1>
      <p>You got ${R[si].correct} of ${s.qs.length} before the hearts ran out. Nothing is lost — the round just restarts.</p>
    </div>
    <button class="big hue" id="again">Try round ${s.letter} again</button>
    <button class="lite" id="chill">Switch to Chill mode and retry</button>
    <button class="lite" id="map">Back to the rounds</button>`;
  document.getElementById("again").onclick = () => start(si);
  document.getElementById("chill").onclick = () => { timed = false; start(si); };
  document.getElementById("map").onclick = home;
}

function roundEnd(){
  document.onkeydown = null; stopTimer();
  const s = STAGES[si], r = R[si];
  const perfect = r.correct === r.total, sticker = r.correct >= r.total - 1;
  const allDone = R.every(x=>x.done), n = R.findIndex(x=>!x.done);
  app.innerHTML = `
    <div class="hero"><span class="blob">${s.em}</span>
      <div class="kicker">Round ${s.letter} cleared</div>
      <h1>${r.correct} / ${r.total}</h1>
      <p>${perfect ? "Clean sweep — not one mistake." : sticker ? "One slip. Sticker unlocked anyway." : "Sticker still locked: you need four out of five."}</p>
    </div>
    <div class="block">
      <div class="label">This round</div>
      <div class="row"><span>Points earned</span><b class="rl" style="margin-left:auto;width:auto">${r.xp}</b></div>
      <div class="row"><span>Total points</span><b class="rl" style="margin-left:auto;width:auto">${xp}</b></div>
      <div class="row"><span>Best combo</span><b class="rl" style="margin-left:auto;width:auto">${bestCombo}</b></div>
      ${sticker ? `<div class="row"><span>Sticker</span><span class="st" style="margin-left:auto">${s.sticker}</span></div>` : ""}
    </div>
    <button class="big hue" id="on">${allDone ? "See final results" : "Round "+STAGES[n].letter+" · "+STAGES[n].name}</button>
    <button class="lite" id="again">Replay round ${s.letter}</button>
    <button class="lite" id="map">Back to the rounds</button>`;
  document.getElementById("on").onclick = () => allDone ? finish() : start(n);
  document.getElementById("again").onclick = () => start(si);
  document.getElementById("map").onclick = home;
}

function finish(){
  document.onkeydown = null; stopTimer(); setHue("#8b5cf6", false);
  const c = R.reduce((a,r)=>a+r.correct,0), t = R.reduce((a,r)=>a+r.total,0);
  const p = Math.round(c/t*100), rk = RANKS.find(x => p >= x[0]);
  const weak = R.map((r,i)=>({i, ratio:r.correct/r.total})).sort((a,b)=>a.ratio-b.ratio)[0];
  app.innerHTML = `
    <div class="hero"><span class="blob">🏆</span>
      <div class="kicker">All eleven rounds</div>
      <h1 class="xp">${xp}</h1>
      <div class="rank" style="color:#fff">${rk[1]}</div>
      <p>${c} of ${t} correct · ${p}% · best combo ${bestCombo}. ${rk[2]}</p>
    </div>
    <div class="block">
      <div class="label">Round by round</div>
      ${R.map((r,i)=>`
        <div class="row">
          <span class="rl" style="color:${hue(i)}">${STAGES[i].letter}</span>
          <span>${STAGES[i].name}</span>
          <span style="margin-left:auto;font-weight:600">${r.correct}/${r.total}</span>
          <span class="bar"><i style="width:${r.correct/r.total*100}%;background:${hue(i)}"></i></span>
        </div>`).join("")}
    </div>
    <div class="block">
      <div class="label">Sticker book</div>
      <div class="stickers">
        ${STAGES.map((s,i)=>{const g=R[i].correct>=R[i].total-1;return `<span class="st ${g?'':'locked'}">${g?s.sticker:'🔒'}</span>`;}).join("")}
      </div>
    </div>
    ${weak.ratio<1 ? `<button class="big hue" id="weak">Replay ${STAGES[weak.i].letter} · ${STAGES[weak.i].name}</button>` : ""}
    <button class="lite" id="map">Back to the rounds</button>`;
  const w = document.getElementById("weak");
  if (w) w.onclick = () => start(weak.i);
  document.getElementById("map").onclick = home;
}

home();
</script>
</body>
</html>
